# nginx site config for FFIS on an EOSC EU Node VM.
#
# Install as /etc/nginx/sites-available/ffis, symlink into sites-enabled,
# remove the stock "default" site, then let certbot add the TLS server block:
#
#   sudo cp deploy/nginx-ffis.conf /etc/nginx/sites-available/ffis
#   sudo ln -sf /etc/nginx/sites-available/ffis /etc/nginx/sites-enabled/ffis
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace eden-ffis.vm.fedcloud.eu with your own hostname before installing.

# Rate limit for the identification endpoints. A public /identify is an open
# invitation to spend this VM's CPU, so cap it. 2 req/s per client IP with a
# short burst absorbs normal interactive use and the API docs page.
limit_req_zone $binary_remote_addr zone=ffis_identify:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name eden-ffis.vm.fedcloud.eu;

    # Must be at least FFIS_MAX_UPLOAD_BYTES, otherwise nginx rejects uploads
    # with a 413 before the app ever sees them. nginx defaults to 1 MB.
    client_max_body_size 100m;
    client_body_timeout 120s;

    access_log /var/log/nginx/ffis.access.log;
    error_log  /var/log/nginx/ffis.error.log;

    location /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location ~ ^/identify {
        limit_req zone=ffis_identify burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Siegfried plus Magika on a 100 MB upload can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
