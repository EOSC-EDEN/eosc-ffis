# Catch-all for the EDEN shared entry VM (see docs/entry-vm.md, Part C).
#
# Requests for a hostname that no service site file claims (scanners hitting
# the bare IP, stale DNS records) are dropped here instead of being routed to
# whichever service nginx happens to treat as the default.
#
#   sudo cp deploy/nginx-entry-default.conf /etc/nginx/sites-available/00-default
#   sudo ln -sf /etc/nginx/sites-available/00-default /etc/nginx/sites-enabled/00-default
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Refuses the TLS handshake for unknown names, so no certificate is needed
    # here. Requires nginx 1.19.4 or later (Ubuntu 24.04 ships 1.24).
    ssl_reject_handshake on;
}
