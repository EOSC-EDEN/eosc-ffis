# Production compose file for the FFIS VM in the EOSC EU Node.
#
# Differs from the development docker-compose.yml in one important way:
# the container port is published on one interface only, never 0.0.0.0. In
# the EDEN setup that is the VM's private IP on eden-net, where nginx on the
# shared entry VM reaches it (docs/entry-vm.md). Set it in deploy/.env:
#
#   echo "FFIS_BIND_ADDR=192.168.0.20" > deploy/.env
#   docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d --build
#
# Without FFIS_BIND_ADDR it falls back to loopback, which is safe but
# unreachable from the entry VM (nginx answers 502).

services:

  ffis:
    build:
      context: ..
      dockerfile: Dockerfile
    image: eosc-ffis:latest
    ports:
      - "${FFIS_BIND_ADDR:-127.0.0.1}:8000:8000"
    environment:
      FFIS_SIEGFRIED_BINARY: sf
      FFIS_MAGIKA_ENABLED: "true"
      FFIS_TIKA_ENABLED: "false"
      FFIS_CACHE_ENABLED: "true"
      FFIS_CACHE_DB_PATH: /data/ffis_cache.db
      # Keep this in sync with client_max_body_size in the nginx site config.
      FFIS_MAX_UPLOAD_BYTES: "104857600"
      # By-reference mode (/identify/path) is denied unless prefixes are listed.
      # Only set this if you also mount the storage below.
      # FFIS_ALLOWED_PATH_PREFIXES: /mnt/tda-storage
    volumes:
      - ffis-cache:/data
      # - /mnt/tda-storage:/mnt/tda-storage:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ffis-cache:
